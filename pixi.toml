[workspace]
name = "biostat707-checkpoint1"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]

[dependencies]
quarto = ">=1.7"
r-base = "4.5.*"
r-knitr = "*"
r-rmarkdown = "*"
"r-data.table" = "*"
r-dplyr = "*"
r-tidyr = "*"
r-ggplot2 = "*"
r-gtsummary = "*"
r-naniar = "*"
r-visdat = "*"
r-upsetr = "*"
r-sessioninfo = "*"
r-here = "*"
r-readr = "*"
python = "3.12.*"
pandas = "*"
scikit-learn = ">=1.9.1,<2"
scipy = ">=1.18.1,<2"
matplotlib = ">=3.11.2,<4"
seaborn = ">=0.13.2,<0.14"
jupyter = ">=1.1.1,<2"
ipykernel = ">=7.4.0,<8"
joblib = ">=1.6.0,<2"
pygam = ">=0.12.0,<0.13"

[tasks]
checkpoint1 = "quarto render checkpoint1.qmd --output-dir output"
checkpoint2 = "quarto render checkpoint2.qmd --output-dir output"
