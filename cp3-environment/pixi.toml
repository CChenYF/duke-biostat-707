[workspace]
name = "biostat707-checkpoint3"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]

# The frozen CP2 model was serialized with scikit-learn 1.6.1.
# Keep these dependencies separate from the submitted CP2 environment.
[dependencies]
python = "3.13.*"
quarto = ">=1.7"
numpy = "==2.2.4"
pandas = "==2.2.3"
scipy = "==1.15.1"
scikit-learn = "==1.6.1"
joblib = "==1.4.2"
statsmodels = "==0.14.4"
shap = ">=0.47,<0.55"
matplotlib = ">=3.9,<4"
jupyter = "*"
ipykernel = "*"

[tasks]
render = { cmd = "python cp3-environment/render.py", cwd = ".." }
